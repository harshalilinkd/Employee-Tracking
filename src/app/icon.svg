<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Employee Tracking">
  <!--
    What this system actually does, drawn.

    Every record here is one of two things about one person: a positive
    contribution or a goofup. The whole app — the signal bands, the net
    balance, the report — is the arithmetic of those two against each other.
    So the mark is a diverging bar chart: recognition rises above the line,
    issues fall below it, and the line is the balance between them.

    A generic chart icon would say "some dashboard". This says what is being
    counted, and it is still three blocks and a rule at 16px.

    Shapes, not glyphs: a favicon rasterises in a context with no guaranteed
    fonts, so nothing here depends on one.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17a186"/>
      <stop offset="0.55" stop-color="#0e7c6b"/>
      <stop offset="1" stop-color="#0a5f52"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#tile)"/>

  <!-- The balance line the two sides are measured against -->
  <rect x="9" y="34" width="46" height="2.2" rx="1.1" fill="#ffffff" opacity="0.45"/>

  <!-- Recognition, above the line -->
  <rect x="12" y="19" width="10" height="15" rx="2.5" fill="#ffffff"/>
  <!-- A goofup, below it — amber, the same colour the app gives issues -->
  <rect x="27" y="36.2" width="10" height="15" rx="2.5" fill="#f3b155"/>
  <!-- Recognition again, and further ahead -->
  <rect x="42" y="12" width="10" height="22" rx="2.5" fill="#ffffff"/>
</svg>
